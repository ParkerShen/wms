spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://生产数据库IP:3306/starlink_wms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      username: 数据库用户名
      password: 数据库密码
      initial-size: 10
      min-idle: 20
      max-active: 100
  data:
    redis:
      host: 生产RedisIP
      port: 6379
      database: 1

# 生产环境关闭 MyBatis SQL 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLogImpl

# 生产环境 JWT 过期时间设为 2 小时
jwt:
  expiration: 7200000
